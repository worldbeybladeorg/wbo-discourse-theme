hide_topic_footer_controls:
  default: true
  description: "Hides the reply/bookmark/share buttons at the bottom of each topic"

nav_items:
  type: string
  textarea: true
  default: '[{"label":"Tournaments","url":"https://worldbeyblade.org/tournaments/"},{"label":"Leagues","url":"https://leaderboard.fighting-spirits.org/"},{"label":"Resources","url":"https://worldbeyblade.org/resources/"},{"label":"Community","url":"/","active":true,"isCommunity":true}]'
  description: "Primary nav menu as a JSON array. Each item: {\"label\":\"…\",\"url\":\"…\"}. Add \"active\":true to underline an item, and \"isCommunity\":true on the one item whose mobile drawer entry expands into the category list. Malformed JSON falls back to the built-in default."

buddy_emblem_endpoint:
  default: "https://worldbeyblade.org/wp-json/wbo/v1/buddies"
  description: "WordPress endpoint returning Buddy Emblem art URLs by Discourse username. The theme overlays each poster's chosen Emblem on the bottom-right of their avatar. Leave blank to disable."

wp_base_url:
  default: "https://worldbeyblade.org"
  description: "WordPress site URL (no trailing slash). Used for the logo link, the account panel's links, and its data (/wp-json/wbo/v1/user-menu). Set to https://wbo.local on the local dev instance."

about_text:
  type: string
  textarea: true
  default: "World Beyblade Organization is a non-profit project to connect the Beyblade community and support independent, fan-run Beyblade events."
  description: "Right sidebar (top-level feeds): the community description."

about_footnote:
  default: "Run by Fighting Spirits Inc., a registered nonprofit."
  description: "Right sidebar: the small line under the description. Leave blank to hide."

discord_invite_url:
  default: "https://discord.gg/92vf8usw"
  description: "Discord invite link for the right sidebar's Join button and the Discord strip shown on narrow screens. Use a permanent (never-expiring) invite. Leave blank to hide both."

discord_server_id:
  default: "620289759171969096"
  description: "Discord server ID, for the live \"online now\" count. Needs Server Widget enabled in the Discord server settings. Leave blank to hide the count."

discord_heading:
  default: "Chat live with other bladers"
  description: "Right sidebar: heading of the Discord box."

discord_description:
  default: "Trades, combos and event meetups on Discord."
  description: "Right sidebar: line under the Discord heading."
